[build]
target = "wasm64-unknown-unknown"

[unstable]
build-std = ["core", "alloc"]

[target.wasm64-unknown-unknown]
# Memory64 target profile. Import shared linear memory from the runtime and keep
# kernel static data high enough to avoid overlap with guest binary segments.
rustflags = [
  "-C",
  "target-feature=+atomics,+bulk-memory,+mutable-globals",
  "-C",
  "link-arg=--import-memory",
  "-C",
  "link-arg=--shared-memory",
  "-C",
  "link-arg=--max-memory=4294967296",
  "-C",
  "link-arg=--export-memory",
  "-C",
  "link-arg=--export=__stack_pointer",
  "-C",
  "link-arg=--global-base=50331648",
]

[alias]
test-kernel = "test"
test-kernel-lib = "test -p tidemark-kernel --lib"
test-kernel-riscv = "test -p tidemark-kernel-tests --test riscv_tests"
test-kernel-ltp = "test -p tidemark-kernel-tests --test ltp ltp_"
