[build]
target = "wasm32-unknown-unknown"

[target.wasm32-unknown-unknown]
# Import shared linear memory from the runtime and place kernel static data
# high enough to avoid overlap with guest binary segments.
rustflags = [
  "-C",
  "target-feature=+atomics,+bulk-memory,+mutable-globals",
  "-C",
  "link-arg=--import-memory",
  "-C",
  "link-arg=--shared-memory",
  "-C",
  "link-arg=--max-memory=4294967296",
  "-C",
  "link-arg=--export-memory",
  "-C",
  "link-arg=--global-base=50331648",
]

[alias]
xtask = "run -p xtask --target x86_64-unknown-linux-gnu --target-dir target --"
# The no_std kernel artifact for wasm32-unknown-unknown needs core/alloc from
# build-std. Keep that scoped to explicit kernel build aliases so host xtask
# and wasm32-wasip1 tests continue to use their normal std toolchains.
build-kernel = "build -Z build-std=core,alloc --target wasm32-unknown-unknown"
build-kernel-release = "build -Z build-std=core,alloc --target wasm32-unknown-unknown --release"
test-kernel = "xtask test"
test-kernel-lib = "xtask test-lib"
test-kernel-riscv = "xtask test-binary riscv_tests"
test-kernel-ltp = "xtask test-binary ltp_tests"

[target.wasm32-wasip1]
runner = ["wasmtime", "--dir=/"]
