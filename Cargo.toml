[package]
name = "tidemark-kernel"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "RISC-V Linux userland kernel for WebAssembly"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libm = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.test]
opt-level = 1
